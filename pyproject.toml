[project]
name = "contract-intelligence"
version = "0.1.0"
description = "DBS Contract Reviewer - Private contract review application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9.0",
    "aiofiles>=24.0.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.23.0",
    "openpyxl>=3.1.0",
    "python-magic>=0.4.27",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "python-docx>=1.1.0",
    "reportlab>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.0",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "types-aiofiles>=24.0.0",
    "types-openpyxl>=1.1.0",
    "types-python-dateutil>=2.9.0",
    "types-PyYAML>=6.0",
    "types-reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]